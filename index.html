<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>elnlen</title>
<meta name="description" content="Web projects by elnlen." />
<link rel="icon" type="image/svg+xml" href="https://elnlen.github.io/camcheck/assets/favicon.svg" />
<style>
  :root {
    --bg: #15171a;
    --panel: #20232a;
    --line: #383d47;
    --text: #edeef0;
    --text-dim: #9096a1;
    --focus: #5fd9a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 480px; width: 100%; }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  p.tagline {
    color: var(--text-dim);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }
  .project {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 20px 22px;
    transition: border-color 0.15s;
  }
  .project:hover { border-color: var(--focus); }
  .project .name {
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 6px;
  }
  .project .desc {
    color: var(--text-dim);
    font-size: 0.88rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>elnlen</h1>
    <p class="tagline">Web projects, hosted on GitHub Pages.</p>
    <a class="project" href="https://elnlen.github.io/camcheck/">
      <div class="name">CamCheck</div>
      <div class="desc">Free browser-based webcam diagnostic tools — test your camera, check resolution, scan QR codes, and more. No install required.</div>
    </a><div class="desc">
  English version: <a href="https://elnlen.github.io/camcheck/en/">https://elnlen.github.io/camcheck/en/</a>
</div>
    
  </div>
</body>
</html>
